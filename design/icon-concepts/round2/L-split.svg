<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- L, Split: a circle cut into bands and slid apart, like a track split into stems. Flat, bold, on white. -->
  <defs>
    <clipPath id="icon"><rect width="1024" height="1024" rx="230"/></clipPath>
    <clipPath id="disc"><circle cx="512" cy="512" r="290"/></clipPath>
  </defs>
  <g clip-path="url(#icon)">
    <rect width="1024" height="1024" fill="#F6F7F9"/>
    <!-- each band is its own slice of the same circle, shifted sideways -->
    <g transform="translate(-44 0)"><g clip-path="url(#disc)"><rect x="200" y="222" width="624" height="140" fill="#0A1F2E"/></g></g>
    <g transform="translate(44 0)"><g clip-path="url(#disc)"><rect x="200" y="372" width="624" height="130" fill="#008BC2"/></g></g>
    <g transform="translate(-24 0)"><g clip-path="url(#disc)"><rect x="200" y="512" width="624" height="130" fill="#35B1E6"/></g></g>
    <g transform="translate(30 0)"><g clip-path="url(#disc)"><rect x="200" y="652" width="624" height="150" fill="#9AD9F5"/></g></g>
  </g>
</svg>
