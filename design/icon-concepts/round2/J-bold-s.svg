<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- J, Bold S: two half-rounds offset against each other, reading as an abstract "s". Flat, on white. -->
  <defs>
    <clipPath id="icon"><rect width="1024" height="1024" rx="230"/></clipPath>
  </defs>
  <g clip-path="url(#icon)">
    <rect width="1024" height="1024" fill="#F6F7F9"/>
    <!-- a bar rounded on the left on top, a bar rounded on the right below -->
    <path d="M372 232 H652 V512 H372 A140 140 0 0 1 372 232 Z" fill="#008BC2"/>
    <path d="M372 512 H652 A140 140 0 0 1 652 792 H372 Z" fill="#0A1F2E"/>
  </g>
</svg>
