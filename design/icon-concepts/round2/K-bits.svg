<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- K, Bits: two glossy spheres, one big, one small, resting together on white. 3D. -->
  <defs>
    <clipPath id="icon"><rect width="1024" height="1024" rx="230"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8EDF3"/>
    </linearGradient>
    <radialGradient id="big" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7FD6F8"/><stop offset="0.45" stop-color="#1B9DD8"/><stop offset="1" stop-color="#03507A"/>
    </radialGradient>
    <radialGradient id="small" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#E4ECF3"/><stop offset="1" stop-color="#AFC0CF"/>
    </radialGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="contact" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <g clip-path="url(#icon)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <ellipse cx="450" cy="790" rx="230" ry="44" fill="#0B3A55" opacity="0.28" filter="url(#contact)"/>
    <ellipse cx="712" cy="792" rx="110" ry="24" fill="#0B3A55" opacity="0.22" filter="url(#contact)"/>
    <circle cx="450" cy="530" r="250" fill="url(#big)"/>
    <ellipse cx="370" cy="420" rx="90" ry="60" fill="url(#spec)" transform="rotate(-30 370 420)"/>
    <circle cx="712" cy="672" r="112" fill="url(#small)"/>
    <ellipse cx="676" cy="624" rx="40" ry="26" fill="url(#spec)" transform="rotate(-30 676 624)"/>
  </g>
</svg>
