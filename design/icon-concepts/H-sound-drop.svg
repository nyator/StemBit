<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- H — Sound Drop: a glossy white drop with three stems inside, on teal. -->
  <defs>
    <clipPath id="icon"><rect width="1024" height="1024" rx="230"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="0.5" stop-color="#14B8A6"/><stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="drop" cx="0.38" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.75" stop-color="#EDFCF9"/><stop offset="1" stop-color="#C4EFE8"/>
    </radialGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="34" stdDeviation="32" flood-color="#064E47" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g clip-path="url(#icon)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <ellipse cx="512" cy="0" rx="460" ry="260" fill="#FFFFFF" opacity="0.35" filter="url(#bloom)"/>
    <path d="M512 176 C512 176 292 436 292 610 A220 220 0 0 0 732 610 C732 436 512 176 512 176 Z" fill="url(#drop)" filter="url(#dropShadow)"/>
    <g stroke="#0F9E90" stroke-width="44" stroke-linecap="round">
      <line x1="432" y1="560" x2="432" y2="680"/>
      <line x1="512" y1="510" x2="512" y2="730"/>
      <line x1="592" y1="580" x2="592" y2="660"/>
    </g>
  </g>
</svg>
