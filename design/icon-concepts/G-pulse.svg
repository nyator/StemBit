<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- G — Pulse: the beat, as rings rippling out from a glossy centre, like the metronome dial. -->
  <defs>
    <clipPath id="icon"><rect width="1024" height="1024" rx="230"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FD0F7"/><stop offset="0.55" stop-color="#1E9BD7"/><stop offset="1" stop-color="#005F92"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.4" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.7" stop-color="#E4F5FF"/><stop offset="1" stop-color="#B9E2F7"/>
    </radialGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="discShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#003A5C" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g clip-path="url(#icon)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <ellipse cx="512" cy="0" rx="460" ry="260" fill="#FFFFFF" opacity="0.35" filter="url(#bloom)"/>
    <circle cx="512" cy="512" r="420" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="16"/>
    <circle cx="512" cy="512" r="320" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="16"/>
    <circle cx="512" cy="512" r="230" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="16"/>
    <circle cx="512" cy="512" r="150" fill="url(#disc)" filter="url(#discShadow)"/>
  </g>
</svg>
